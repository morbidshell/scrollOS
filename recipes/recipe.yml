---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: scrollos
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: script
    scripts:
      - add-spotify-repo.sh
  - type: dnf
    repos:
      copr:
        - avengemedia/dms
        - avengemedia/danklinux
      files:
       # - https://negativo17.org/repos/fedora-spotify.repo
        - https://download.opensuse.org/repositories/isv:/BrowserWorks/Fedora_%OS_VERSION%/isv:BrowserWorks.repo
      nonfree: rpmfusion      
    install:
      packages:
        - https://windscribe.com/install/desktop/linux_rpm_x64/
        - #spotify-client
        - niri
        - dms
        - dms-greeter
        - ghostty
        - nemo
        - quickshell-git
        - dankcalendar-git
        - danksearch
        - waterfox
      exclude:
        - firefox
        - alacritty
        - waybar
        - fuzzel
  - type: default-flatpaks
    configurations:
      - install:
          - com.spotify.Client
      - type: signing # this sets up the proper policy & signing files for signed images to work fully
